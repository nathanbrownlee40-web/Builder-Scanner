function chart(arr){let d=arr.filter(x=>x.result!=='Pending').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).reduce((a,x)=>{a.push({d:x.date,v:(a.at(-1)?.v||0)+profit(x)});return a},[]);if(!d.length)return '<div class="empty">Settle a bet to start the graph.</div>';let W=800,H=250,p=24,min=Math.min(0,...d.map(x=>x.v)),max=Math.max(0,...d.map(x=>x.v)),r=max-min||1,pts=d.map((x,i)=>`${p+i*(W-2*p)/Math.max(1,d.length-1)},${H-p-(x.v-min)/r*(H-2*p)}`).join(' '),zy=H-p-(0-min)/r*(H-2*p);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${zy}" x2="${W-p}" y2="${zy}" class="zero"/><polyline points="${pts}" class="line"/></svg>`}

function setupBuilder(){let games=[newGame()];$('#games').innerHTML=renderGames(games);const refresh=()=>{$('#games').innerHTML=renderGames(games);$('#builderCount').textContent=`${games.length} game${games.length===1?'':'s'} · ${games.reduce((n,g)=>n+g.markets.length,0)} market${games.reduce((n,g)=>n+g.markets.length,0)===1?'':'s'}`;bind()};function bind(){$$('.addMarket').forEach(b=>b.onclick=()=>{games[+b.dataset.i].markets.push({market:'',selection:'',odds:''});refresh()});$$('.removeGame').forEach(b=>b.onclick=()=>{games.splice(+b.dataset.i,1);if(!games.length)games=[newGame()];refresh()});$$('.removeMarket').forEach(b=>b.onclick=()=>{let g=games[+b.dataset.i];if(g.markets.length>1)g.markets.splice(+b.dataset.midx,1);refresh()});$$('[data-game]').forEach(x=>x.oninput=()=>games[+x.dataset.game].fixture=x.value);$$('[data-m]').forEach(x=>x.oninput=()=>{let [g,m,k]=x.dataset.m.split(',');games[+g].markets[+m][k]=x.value})}bind();window._builderSetGames=(g)=>{games=g;refresh()};$('#addGame').onclick=()=>{games.push(newGame());refresh()};$('#builderForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),clean=games.map(g=>({...g,markets:g.markets.filter(m=>m.market||m.selection||m.odds)})).filter(g=>g.fixture||g.markets.length),b=Object.fromEntries(f.entries());let legs=clean.flatMap(g=>g.markets.map(m=>({...m,fixture:g.fixture})));builders.unshift({id:Date.now(),...b,stake:num(b.stake),odds:num(b.odds),return:num(b.return),gamesList:clean,games:clean.length,selections:legs.length});save();nav('Builder History')}}

function setupSingle(){let f=$('#singleForm');const calc=()=>{let o=num(f.odds.value),e=num(f.estimatedProbability.value),imp=o?100/o:0,edge=e?e-imp:0;$('#valueCalc').textContent=`Implied probability: ${imp?imp.toFixed(1)+'%':'—'} · Your estimate: ${e?e.toFixed(1)+'%':'—'} · Edge: ${e?edge.toFixed(1)+'%':'—'}`};f.oninput=calc;f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f).entries()),o=num(x.odds),est=num(x.estimatedProbability),imp=o?100/o:0;singles.unshift({id:Date.now(),...x,stake:num(x.stake),odds:o,return:num(x.return),estimatedProbability:est,impliedProbability:imp,edge:est?est-imp:0});save();nav('Single History')}}

function splitFixture(line){let m=line.match(/^(.{2,55}?)\s+(?:v|vs\.?|versus|@)\s+(.{2,55}?)$/i);return m?`${m[1].trim()} v ${m[2].trim()}`:''}
function looksLikeNoise(line){return /^(stake|odds|total odds|price|return|potential return|possible return|payout|winnings|cash out|bet builder|single|singles|accumulator|multi|placed|selection|selections)$/i.test(line)||/^(£|€|\$)?\s*\d+(?:[.,]\d{1,2})?$/.test(line)}
function detectMarket(s){let x=s.toLowerCase();if(/both teams to score|\bbtts\b/.test(x))return 'Both Teams To Score';if(/\bover\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/.test(x))return (x.match(/\bover\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/)||[])[0]||'Over';if(/\bunder\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/.test(x))return (x.match(/\bunder\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/)||[])[0]||'Under';if(/anytime goalscorer|to score|score anytime/.test(x))return 'Anytime Goalscorer';if(/double chance/.test(x))return 'Double Chance';if(/draw no bet|\bdnb\b/.test(x))return 'Draw No Bet';if(/handicap|asian handicap/.test(x))return 'Handicap';if(/corners?/.test(x))return 'Corners';if(/cards?/.test(x))return 'Cards';if(/shots? on target|\bshots?\b/.test(x))return 'Shots';if(/first half|half time/.test(x))return 'Half Time';if(/match result|match winner|\bto win\b/.test(x))return 'Match Result';return ''}
function cleanSelection(s,market){let x=s;if(market){let re=market.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');x=x.replace(new RegExp(re,'ig'),'')}return x.replace(/\s{2,}/g,' ').trim()}
function parseOCR(text){
 const raw=String(text||'');
 const lines=raw.split(/\r?\n/).map(x=>x.replace(/[|¦]/g,'I').replace(/[“”]/g,'').replace(/\s+/g,' ').trim()).filter(Boolean);
 const all=lines.join(' ');
 const moneyMatch=all.match(/(?:stake|bet amount|bet stake|amount wagered|wager)\s*[:\-]?\s*[£€$]?\s*(\d+(?:[.,]\d{1,2})?)/i);
 const stake=moneyMatch?moneyMatch[1].replace(',','.'):'';
 const oddsMatches=[...all.matchAll(/(?:total\s+odds|accumulator\s+odds|odds|price)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)/ig)];
 const totalOdds=oddsMatches.length?oddsMatches[oddsMatches.length-1][1].replace(',','.'):'';

 const bad=/^(stake|bet amount|bet stake|amount|odds|total odds|price|return|potential return|possible return|payout|winnings|cash out|bet builder|single|singles|accumulator|multi|placed|selection|selections|open|edit|share|add to bet slip|bet slip)$/i;
 const fixtureRx=/^(.{2,55}?)\s+(?:v|vs\.?|versus|@)\s+(.{2,55}?)$/i;
 const numberRx=/(\d+[.,]\d{1,2})\s*$/;
 const marketWords=/\b(over|under|both teams|btts|match result|match winner|double chance|draw no bet|handicap|asian handicap|anytime|to score|corners?|cards?|shots?|shots on target|half time|first half|win to nil|clean sheet|team to score|total goals?|goal line|player)\b/i;

 const games=[]; let current=null;
 const ensureGame=()=>{if(!current){current={fixture:'',markets:[]};games.push(current)}return current};

 for(const line0 of lines){
   if(bad.test(line0)||/^[£€$]?\s*\d+(?:[.,]\d{1,2})?$/.test(line0))continue;
   const fx=line0.match(fixtureRx);
   if(fx){
     current={fixture:(fx[1]+' v '+fx[2]).replace(/\s+/g,' ').trim(),markets:[]};
     games.push(current); continue;
   }
   let line=line0.replace(/\s{2,}/g,' ').trim();
   const om=line.match(numberRx);
   let odds=om?om[1].replace(',','.'):'';
   if(om)line=line.slice(0,om.index).trim();
   if(!line||line.length<2||line.length>100)continue;

   // Accept a market/selection only when the line contains recognisable betting language.
   if(marketWords.test(line)){
     const market=detectMarket(line);
     const selection=cleanSelection(line,market);
     if(market||selection){
       ensureGame().markets.push({selection:selection.replace(/\s{2,}/g,' ').trim(),market,odds});
     }
   }
 }

 // Some bookmakers put the fixture and market/selection on one line.
 if(!games.length){
   for(const line0 of lines){
     const fx=line0.match(fixtureRx);
     if(fx){current={fixture:(fx[1]+' v '+fx[2]).trim(),markets:[]};games.push(current);continue}
   }
 }

 // If OCR missed "v", do not guess team names from arbitrary text.
 const cleaned=games.map(g=>({
   fixture:g.fixture,
   markets:g.markets.filter(m=>m.market||m.odds)
 })).filter(g=>g.fixture||g.markets.length);

 const finalGames=cleaned.length?cleaned:[{fixture:'',markets:[]}];
 const first=finalGames[0].markets[0]||{};
 return {
   stake,
   odds:totalOdds,
   gamesList:finalGames,
   selection:first.selection||'',
   market:first.market||'',
   debugText:raw
 };
}
function fillFromOCR(mode,p){let form=mode==='single'?$('#singleForm'):$('#builderForm');if(!form)return;if(form.elements.stake&&p.stake)form.elements.stake.value=p.stake;if(mode==='single'){if(form.elements.odds&&p.odds)form.elements.odds.value=p.odds;if(form.elements.market)form.elements.market.value=p.market||'';if(form.elements.selection)form.elements.selection.value=p.selection||'';form.dispatchEvent(new Event('input'))}else if(mode==='builder'&&p.gamesList){if(window._builderSetGames)window._builderSetGames(p.gamesList);else window._ocrGames=p.gamesList}}
function history(type){let arr=type==='single'?singles:builders;return `<div class="content"><section class="card"><div class="head"><div><b>${type==='single'?'Singles':'Builders'} profit</b><span>Separate from the other bet type</span></div></div><div class="chart">${chart(arr)}</div></section><section class="card"><div class="toolbar"><input id="search" placeholder="⌕ Search bets…"><select id="filter"><option>All</option><option>Won</option><option>Lost</option><option>Pending</option><option>Void</option></select></div><div id="rows" class="table"></div></section></div>`}
function renderRows(type){let arr=type==='single'?singles:builders,q=($('#search')?.value||'').toLowerCase(),fil=$('#filter')?.value||'All',rows=arr.filter(b=>(fil==='All'||b.result===fil)&&JSON.stringify(b).toLowerCase().includes(q));let html=type==='single'?'<div class="row th"><span>Date</span><span>Single</span><span>Odds</span><span>Stake</span><span>Edge</span><span>Result</span><span>P/L</span><span></span></div>':'<div class="row th"><span>Date</span><span>Builder</span><span>Games</span><span>Odds</span><span>Stake</span><span>Result</span><span>P/L</span><span></span></div>';html+=rows.map(b=>{let p=profit(b);return type==='single'?`<div class="row"><span>${b.date}</span><span><b>${esc(b.selection||'Unknown')}</b><small>${esc(b.market||'Market')} · ${esc(b.bookmaker||'Bookmaker')}</small></span><span>${num(b.odds).toFixed(2)}</span><span>${money(b.stake)}</span><span>${num(b.edge).toFixed(1)}%</span><span><select class="status ${b.result}" data-result="single" data-id="${b.id}"><option ${b.result==='Pending'?'selected':''}>Pending</option><option ${b.result==='Won'?'selected':''}>Won</option><option ${b.result==='Lost'?'selected':''}>Lost</option><option ${b.result==='Void'?'selected':''}>Void</option></select></span><span class="profit ${p>=0?'pos':'neg'}">${b.result==='Pending'?'…':(p>=0?'+':'')+money(p)}</span><button class="iconbtn del" data-type="single" data-id="${b.id}">×</button></div>`:`<div class="row"><span>${b.date}</span><span><b>${esc(b.bookmaker||'Unknown bookmaker')}</b><small>${esc(b.sport||'')} · ${b.selections||0} markets</small></span><span>${b.games||0}</span><span>${num(b.odds).toFixed(2)}</span><span>${money(b.stake)}</span><span><select class="status ${b.result}" data-result="builder" data-id="${b.id}"><option ${b.result==='Pending'?'selected':''}>Pending</option><option ${b.result==='Won'?'selected':''}>Won</option><option ${b.result==='Lost'?'selected':''}>Lost</option><option ${b.result==='Void'?'selected':''}>Void</option></select></span><span class="profit ${p>=0?'pos':'neg'}">${b.result==='Pending'?'…':(p>=0?'+':'')+money(p)}</span><button class="iconbtn del" data-type="builder" data-id="${b.id}">×</button></div>`}).join('');$('#rows').innerHTML=rows.length?html:'<div class="emptylist">No bets match your filters.</div>';$$('.status').forEach(x=>x.onchange=()=>{let arr=x.dataset.result==='single'?singles:builders,b=arr.find(z=>z.id==x.dataset.id);if(b){b.result=x.value;if(x.value==='Won')b.return=num(b.stake)*num(b.odds);if(x.value==='Lost'||x.value==='Void')b.return=0;save();renderRows(type)}});$$('.del').forEach(x=>x.onclick=()=>{if(confirm('Delete this bet?')){if(x.dataset.type==='single')singles=singles.filter(b=>b.id!=x.dataset.id);else builders=builders.filter(b=>b.id!=x.dataset.id);save();renderRows(type)}});$('#search').oninput=()=>renderRows(type);$('#filter').onchange=()=>renderRows(type)}
function analytics(){let s=stats(singles),b=stats(builders),market=group(singles,x=>x.market||'Unspecified'),edge=group(singles,x=>{let e=num(x.edge);return e<5?'0–5%':e<10?'5–10%':e<15?'10–15%':'15%+'}),sport=group(singles,x=>x.sport||'Unspecified'),builderSport=group(builders,x=>x.sport||'Unspecified');return `<div class="analyticsgrid"><section class="card"><div class="head"><div><b>Builders</b><span>Independent performance</span></div></div>${statLines(b)}</section><section class="card"><div class="head"><div><b>Value singles</b><span>Independent performance</span></div></div>${statLines(s)}</section><section class="card"><div class="head"><div><b>Singles by market</b><span>Profit, bets and ROI</span></div></div>${breakdown(market)}</section><section class="card"><div class="head"><div><b>Singles by value edge</b><span>See whether your estimated edge is paying</span></div></div>${breakdown(edge)}</section><section class="card"><div class="head"><div><b>Singles by sport</b><span>Separate performance</span></div></div>${breakdown(sport)}</section><section class="card"><div class="head"><div><b>Builders by sport</b><span>Separate performance</span></div></div>${breakdown(builderSport)}</section></div>`}
function statLines(x){return `<div class="statline"><b>Total profit</b><span>${x.n} bets</span><strong class="${x.p>=0?'pos':'neg'}">${money(x.p)}</strong></div><div class="statline"><b>Win rate</b><span>${x.settled} settled</span><strong>${x.rate.toFixed(1)}%</strong></div><div class="statline"><b>ROI</b><span>settled stake</span><strong>${x.roi.toFixed(1)}%</strong></div><div class="statline"><b>Total staked</b><span>settled</span><strong>${money(x.stake)}</strong></div>`}
function group(arr,fn){let o={};arr.forEach(x=>{let k=fn(x);o[k]??={n:0,p:0,s:0,w:0};o[k].n++;o[k].p+=profit(x);o[k].s+=num(x.stake);if(x.result==='Won')o[k].w++});return o}
function breakdown(o){let keys=Object.keys(o);if(!keys.length)return '<div class="emptylist">Add bets to see breakdowns.</div>';let max=Math.max(1,...keys.map(k=>Math.abs(o[k].p)));return keys.sort().map(k=>`<div class="barrow"><div class="bt"><b>${esc(k)}</b><span>${o[k].n} bets · ${o[k].s?((o[k].p/o[k].s)*100).toFixed(1):'0.0'}% ROI · <strong class="${o[k].p>=0?'pos':'neg'}">${money(o[k].p)}</strong></span></div><div class="bar"><i style="width:${Math.max(3,Math.abs(o[k].p)/max*100)}%"></i></div></div>`).join('')}
function settings(){return `<div class="content"><section class="card"><div class="head"><div><b>App & data</b><span>Everything is stored locally in this browser.</span></div></div><div class="quick"><button class="ghost" id="export">Export full backup</button><button class="ghost" id="import">Import backup</button><button class="ghost" id="installHelp">Install app</button><button class="danger" id="reset">Reset all data</button></div><div class="privacy" style="margin-top:12px"><b>Screenshot privacy</b><br>OCR is performed in your browser using Tesseract.js. The tracker stores bet data in localStorage. No betting API or server is required.</div></section></div>`}

function attachScanner(id,mode){
 const input=document.getElementById(id), drop=document.getElementById(id+'drop'),
       choose=document.getElementById(id+'choose'), bar=document.getElementById(id+'bar'),
       status=document.getElementById(id+'status');
 if(!input||!drop)return;
 const setStatus=(s,p=null)=>{status.textContent=s;if(p!==null)bar.style.width=Math.max(0,Math.min(100,p))+'%';};
 const openPicker=()=>input.click();
 choose?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openPicker()});
 drop.addEventListener('click',e=>{if(e.target!==choose)openPicker()});
 drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker()}});
 input.addEventListener('change',async()=>{
   const file=input.files&&input.files[0]; if(!file)return;
   if(!file.type.startsWith('image/')){setStatus('Please choose an image screenshot.');return}
   try{
     setStatus('Loading screenshot…',5);
     const result=await Tesseract.recognize(file,'eng',{
       logger:m=>{
         if(m.status==='loading tesseract core')setStatus('Loading OCR engine…',10);
         else if(m.status==='loading language traineddata')setStatus('Loading OCR language…',20);
         else if(m.status==='recognizing text')setStatus('Reading bet slip…',20+(m.progress||0)*65);
       }
     });
     setStatus('Sorting teams, markets, odds and stake…',90);
     const parsed=parseOCR(result.data.text||'');
     fillFromOCR(mode,parsed);
     setStatus('Done — check the fields before saving.',100);
     if(parsed.debugText) console.log('OCR text:',parsed.debugText);
   }catch(err){
     console.error(err);
     setStatus('OCR could not read this screenshot. Try a clearer/full screenshot.');
     bar.style.width='0%';
   }finally{
     input.value='';
   }
 });
}

function render(){let v=page==='Dashboard'?dashboard():page==='Add Builder'?builderForm():page==='Add Single'?singleForm():page==='Builder History'?history('builder'):page==='Single History'?history('single'):page==='Analytics'?analytics():settings();$('#view').innerHTML=v;if(page==='Add Builder'){setupBuilder();attachScanner('builderFile','builder')}if(page==='Add Single'){setupSingle();attachScanner('singleFile','single')}if(page==='Builder History')renderRows('builder');if(page==='Single History')renderRows('single');if(page==='Settings'){ $('#export').onclick=exportData;$('#import').onclick=()=>$('#importFile').click();$('#installHelp').onclick=()=>installApp();$('#reset').onclick=()=>{if(confirm('Delete all tracked bets?')){builders=[];singles=[];save();nav('Dashboard')}}}$$('[data-go]').forEach(x=>x.onclick=()=>nav(x.dataset.go))}
function exportData(){let blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),builders,singles},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bet-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(Array.isArray(d.builders))builders=d.builders;if(Array.isArray(d.singles))singles=d.singles;save();alert('Backup imported.');nav('Dashboard')}catch{alert('That backup file could not be read.')}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});async function installApp(){if(deferred){await deferred.prompt();deferred=null;$('#install').hidden=true}else alert('On Android Chrome use ⋮ → Install app / Add to Home screen.');}$('#install').onclick=installApp;
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
