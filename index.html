<main class="main"><header><div><div class="eyebrow">BET BUILDER + VALUE BET TRACKER</div><h1 id="title">Dashboard</h1></div><div class="actions"><button id="install" class="ghost" hidden>Install app</button><button class="primary" data-go="Add Builder">＋ Builder</button><button class="ghost" data-go="Add Single">＋ Single</button></div></header><div id="view"></div></main></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const seedBuilders=[{id:1,date:'2026-09-02',bookmaker:'Bet365',sport:'Football',stake:10,odds:4.5,return:45,result:'Won',note:'Starter example',gamesList:[{fixture:'Arsenal v Chelsea',markets:[{market:'Match Result',selection:'Arsenal',odds:1.8},{market:'Goals',selection:'Over 2.5',odds:1.7}]},{fixture:'Liverpool v Everton',markets:[{market:'Corners',selection:'Over 8.5',odds:1.6},{market:'Cards',selection:'Over 3.5',odds:1.5}]}]}];
const money=n=>'£'+Number(n||0).toFixed(2), num=v=>{let n=Number(String(v??'').replace(/[£€$,%]/g,''));return Number.isFinite(n)?n:0};
let builders=load('bt-builders',seedBuilders),singles=load('bt-singles',[]),page='Dashboard',deferred=null;
function load(k,s){try{let v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:s}catch{return s}} function save(){localStorage.setItem('bt-builders',JSON.stringify(builders));localStorage.setItem('bt-singles',JSON.stringify(singles))}
function profit(b){if(b.result==='Won')return num(b.return)-num(b.stake);if(b.result==='Lost')return-num(b.stake);return 0}
function stats(a){let settled=a.filter(x=>x.result!=='Pending'),stake=settled.reduce((n,x)=>n+num(x.stake),0),p=settled.reduce((n,x)=>n+profit(x),0),w=settled.filter(x=>x.result==='Won').length,odds=settled.filter(x=>num(x.odds)>0).reduce((n,x)=>n+num(x.odds),0),oddsN=settled.filter(x=>num(x.odds)>0).length;return{n:a.length,settled:settled.length,p,stake,w,rate:settled.length?w/settled.length*100:0,roi:stake?p/stake*100:0,avgOdds:oddsN?odds/oddsN:0}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nav(p){page=p;$$('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));$('#title').textContent=p;render()}
$$('.nav').forEach(x=>x.onclick=()=>nav(x.dataset.page));$$('[data-go]').forEach(x=>x.onclick=()=>nav(x.dataset.go));
function dashboard(){let b=stats(builders),s=stats(singles),a=stats([...builders,...singles]);return `<div class="content"><section class="hero"><div><span class="pill">LOCAL TRACKER</span><h2>Builders and value singles in one place — with separate performance stats.</h2><p>Scan screenshots, build multi-game multis with as many markets as you need, then track your value singles independently.</p></div><div class="heroprofit">${money(a.p)}<small>combined settled profit</small></div></section><div class="kpis"><div class="kpi"><small>All bets</small><strong>${a.n}</strong><em>${a.settled} settled · ${a.n-a.settled} pending</em></div><div class="kpi"><small>Builder P/L</small><strong>${money(b.p)}</strong><em>${b.rate.toFixed(1)}% win · ${b.roi.toFixed(1)}% ROI</em></div><div class="kpi"><small>Singles P/L</small><strong>${money(s.p)}</strong><em>${s.rate.toFixed(1)}% win · ${s.roi.toFixed(1)}% ROI · avg odds ${s.avgOdds?s.avgOdds.toFixed(2):'—'}</em></div><div class="kpi"><small>Combined ROI</small><strong>${a.roi.toFixed(1)}%</strong><em>${money(a.p)} profit</em></div></div><div class="grid2"><section class="card"><div class="head"><div><b>Combined profit / loss</b><span>Settled builders + singles</span></div></div><div class="chart">${chart([...builders,...singles])}</div></section><section class="card"><div class="head"><div><b>Quick actions</b><span>Start tracking</span></div></div><div class="quick"><button class="primary" data-go="Add Builder">📷 Scan builder slip</button><button class="ghost" data-go="Add Single">📷 Scan value single</button><button class="ghost" data-go="Builder History">Builder history</button><button class="ghost" data-go="Single History">Singles history</button></div></section></div></div>`}
function chart(arr){let d=arr.filter(x=>x.result!=='Pending').slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).reduce((a,x)=>{a.push({d:x.date,v:(a.at(-1)?.v||0)+profit(x)});return a},[]);if(!d.length)return '<div class="empty">Settle a bet to start the graph.</div>';let W=800,H=250,p=24,min=Math.min(0,...d.map(x=>x.v)),max=Math.max(0,...d.map(x=>x.v)),r=max-min||1,pts=d.map((x,i)=>`${p+i*(W-2*p)/Math.max(1,d.length-1)},${H-p-(x.v-min)/r*(H-2*p)}`).join(' '),zy=H-p-(0-min)/r*(H-2*p);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${zy}" x2="${W-p}" y2="${zy}" class="zero"/><polyline points="${pts}" class="line"/></svg>`}
function scanner(id,mode){return `<section class="card scanner"><div class="head"><div><b>📷 Screenshot reader</b><span>${mode==='single'?'Read a value-bet single':'Read a multi-game builder'} · OCR runs in your browser</span></div></div><input id="${id}" class="file" type="file" accept="image/png,image/jpeg,image/webp"><div class="drop" id="${id}drop" role="button" tabindex="0"><div><div class="upload">↑</div><b>Choose bet slip screenshot</b><div>Tap here or use the button below</div><button type="button" class="scanbtn" id="${id}choose">Choose screenshot</button><small>PNG · JPG · WEBP</small></div></div><div class="progress"><i id="${id}bar"></i></div><div class="statusbox" id="${id}status">Ready — choose a screenshot to scan.</div><div id="${id}preview"></div></section>`}
function builderForm(){return `<div class="formgrid"><div>${scanner('builderFile','builder')}</div><form id="builderForm" class="card"><div class="head"><div><b>Builder details</b><span>One builder can contain unlimited games and markets.</span></div></div><div class="fields"><label>Bookmaker<input name="bookmaker" placeholder="e.g. Bet365"></label><label>Sport<input name="sport" value="Football"></label><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Stake (£)<input name="stake" type="number" step="0.01"></label><label>Total odds<input name="odds" type="number" step="0.01"></label><label>Return (£)<input name="return" type="number" step="0.01"></label><label>Result<select name="result"><option>Pending</option><option>Won</option><option>Lost</option><option>Void</option></select></label><label>Note<input name="note" placeholder="Optional"></label></div><div class="sectionrow"><div><b>Games & markets</b><span id="builderCount">1 game · 1 market</span></div><button type="button" class="ghost" id="addGame">＋ Add another game</button></div><div id="games"></div><button class="primary save">Save builder →</button></form></div>`}
function newGame(){return{fixture:'',markets:[{market:'',selection:''}]}}
function renderGames(games){return games.map((g,gi)=>`<div class="game"><div class="gamehead"><div><b>Game ${gi+1}</b><span>Every market stays under the correct game.</span></div>${games.length>1?`<button type="button" class="danger removeGame" data-i="${gi}">Remove game</button>`:''}</div><div class="fixture"><label>Teams / fixture<input data-game="${gi}" value="${esc(g.fixture||'')}" placeholder="e.g. Arsenal v Chelsea"></label></div><div class="markethead"><b>Markets</b><button type="button" class="ghost addMarket" data-i="${gi}">+ Add market</button></div>${g.markets.map((m,mi)=>`<div class="market"><div class="num">${mi+1}</div><input data-m="${gi},${mi},selection" value="${esc(m.selection||'')}" placeholder="Selection"><input data-m="${gi},${mi},market" value="${esc(m.market||'')}" placeholder="Market"><button type="button" class="iconbtn removeMarket" data-i="${gi}" data-midx="${mi}">x</button></div>`).join('')}</div>`).join('')}
function setupBuilder(){let games=[newGame()];$('#games').innerHTML=renderGames(games);const refresh=()=>{$('#games').innerHTML=renderGames(games);$('#builderCount').textContent=`${games.length} game${games.length===1?'':'s'} · ${games.reduce((n,g)=>n+g.markets.length,0)} market${games.reduce((n,g)=>n+g.markets.length,0)===1?'':'s'}`;bind()};function bind(){$$('.addMarket').forEach(b=>b.onclick=()=>{games[+b.dataset.i].markets.push({market:'',selection:''});refresh()});$$('.removeGame').forEach(b=>b.onclick=()=>{games.splice(+b.dataset.i,1);if(!games.length)games=[newGame()];refresh()});$$('.removeMarket').forEach(b=>b.onclick=()=>{let g=games[+b.dataset.i];if(g.markets.length>1)g.markets.splice(+b.dataset.midx,1);refresh()});$$('[data-game]').forEach(x=>x.oninput=()=>games[+x.dataset.game].fixture=x.value);$$('[data-m]').forEach(x=>x.oninput=()=>{let [g,m,k]=x.dataset.m.split(',');games[+g].markets[+m][k]=x.value})}bind();window._builderSetGames=(g)=>{games=(g||[]).map(x=>({...x,markets:(x.markets||[]).map(m=>({selection:m.selection||'',market:m.market||''}))}));if(!games.length)games=[newGame()];refresh()};$('#addGame').onclick=()=>{games.push(newGame());refresh()};const calc=()=>{let st=num($('#builderForm').elements.stake.value),ret=num($('#builderForm').elements.return.value),od=st&&ret?ret/st:0;$('#builderForm').elements.odds.value=od?od.toFixed(2):''};$('#builderForm').elements.stake.oninput=calc;$('#builderForm').elements.return.oninput=calc;$('#builderForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),clean=games.map(g=>({...g,markets:g.markets.filter(m=>m.market||m.selection)})).filter(g=>g.fixture||g.markets.length),b=Object.fromEntries(f.entries()),st=num(b.stake),ret=num(b.return),od=st&&ret?ret/st:num(b.odds);builders.unshift({id:Date.now(),...b,stake:st,odds:od,return:ret,gamesList:clean,games:clean.length,selections:clean.reduce((n,g)=>n+g.markets.length,0)});save();nav('Builder History')}}
function singleForm(){return `<div class="formgrid"><div>${scanner('singleFile','single')}</div><form id="singleForm" class="card"><div class="head"><div><b>Value bet single</b><span>Independent profit, ROI and value-edge tracking.</span></div></div><div class="fields"><label>Bookmaker<input name="bookmaker" placeholder="e.g. Bet365"></label><label>Sport<input name="sport" value="Football"></label><label>Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>League / competition<input name="league" placeholder="e.g. Premier League"></label><label>Market<input name="market" placeholder="e.g. Over 2.5 goals"></label><label>Selection<input name="selection" placeholder="e.g. Over 2.5"></label><label>Odds<input name="odds" type="number" step="0.01"></label><label>Stake (£)<input name="stake" type="number" step="0.01"></label><label>Estimated probability (%)<input name="estimatedProbability" type="number" step="0.1" placeholder="e.g. 62"></label><label>Return (£)<input name="return" type="number" step="0.01"></label><label>Result<select name="result"><option>Pending</option><option>Won</option><option>Lost</option><option>Void</option></select></label><label>Note<input name="note" placeholder="Why it was value"></label></div><div class="valuebox"><b>Value check</b><span id="valueCalc">Implied probability: — · Your estimate: — · Edge: —</span></div><button class="primary save">Save value single →</button></form></div>`}
function setupSingle(){let f=$('#singleForm');const calc=()=>{let st=num(f.stake.value),ret=num(f.return.value),o=num(f.odds.value);if(st&&ret&&!o){o=ret/st;f.odds.value=o.toFixed(2)}let e=num(f.estimatedProbability.value),imp=o?100/o:0,edge=e?e-imp:0;$('#valueCalc').textContent=`Implied probability: ${imp?imp.toFixed(1)+'%':'—'} · Your estimate: ${e?e.toFixed(1)+'%':'—'} · Edge: ${e?edge.toFixed(1)+'%':'—'} · Return: ${ret?money(ret):'—'}`};f.oninput=calc;f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f).entries()),st=num(x.stake),ret=num(x.return),o=num(x.odds)||(st&&ret?ret/st:0),est=num(x.estimatedProbability),imp=o?100/o:0;singles.unshift({id:Date.now(),...x,stake:st,odds:o,return:ret,estimatedProbability:est,impliedProbability:imp,edge:est?est-imp:0});save();nav('Single History')}}
function cleanOCRLine(x){return x.replace(/[|¦]/g,'I').replace(/[“”]/g,'').replace(/\bBet Builder\b/ig,'').replace(/\bCash Out\b/ig,'').trim()}
function normaliseOdds(x){if(!x)return '';x=String(x).replace(',','.').trim();return /^\d+(?:\.\d+)?$/.test(x)?x:''}
function splitFixture(line){let m=line.match(/^(.{2,55}?)\s+(?:v|vs\.?|versus|@)\s+(.{2,55}?)$/i);return m?`${m[1].trim()} v ${m[2].trim()}`:''}
function looksLikeNoise(line){return /^(stake|odds|total odds|price|return|potential return|possible return|payout|winnings|cash out|bet builder|single|singles|accumulator|multi|placed|selection|selections)$/i.test(line)||/^(£|€|\$)?\s*\d+(?:[.,]\d{1,2})?$/.test(line)}
function detectMarket(s){let x=s.toLowerCase();if(/both teams to score|\bbtts\b/.test(x))return 'Both Teams To Score';if(/\bover\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/.test(x))return (x.match(/\bover\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/)||[])[0]||'Over';if(/\bunder\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/.test(x))return (x.match(/\bunder\s+\d+(?:\.5)?\s+(goals?|corners?|cards?|shots?)/)||[])[0]||'Under';if(/anytime goalscorer|to score|score anytime/.test(x))return 'Anytime Goalscorer';if(/double chance/.test(x))return 'Double Chance';if(/draw no bet|\bdnb\b/.test(x))return 'Draw No Bet';if(/handicap|asian handicap/.test(x))return 'Handicap';if(/corners?/.test(x))return 'Corners';if(/cards?/.test(x))return 'Cards';if(/shots? on target|\bshots?\b/.test(x))return 'Shots';if(/first half|half time/.test(x))return 'Half Time';if(/match result|match winner|\bto win\b/.test(x))return 'Match Result';return ''}
function cleanSelection(s,market){let x=s;if(market){let re=market.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');x=x.replace(new RegExp(re,'ig'),'')}return x.replace(/\s{2,}/g,' ').trim()}
function normaliseOCRLine(s){
 return String(s||'').replace(/[|¦]/g,'I').replace(/[“”]/g,'').replace(/\s+/g,' ').trim()
   .replace(/\bV5\b/ig,'v').replace(/\bV8\b/ig,'v').replace(/\bVS\b/ig,'v').replace(/\bVRS\b/ig,'v');
}
function fixtureFromLine(line){
 let s=normaliseOCRLine(line).replace(/\s*@\s*/,' v ');
 let m=s.match(/^(.{2,70}?)\s+(?:v|versus)\s+(.{2,70}?)$/i);
 if(!m)return '';
 let a=m[1].replace(/[^A-Za-zÀ-ÿ0-9 .&'’-]/g,' ').replace(/\s+/g,' ').trim();
 let b=m[2].replace(/[^A-Za-zÀ-ÿ0-9 .&'’-]/g,' ').replace(/\s+/g,' ').trim();
 if(a.length<2||b.length<2)return '';
 return `${a} v ${b}`;
}
function parseOCR(text){
 const raw=String(text||'');
 const lines=raw.split(/\r?\n/).map(normaliseOCRLine).filter(Boolean);
 const all=lines.join(' ');
 const stakeMatch=all.match(/(?:stake|bet amount|bet stake|amount wagered|wager)\s*[:\-]?\s*[£€$]?\s*(\d+(?:[.,]\d{1,2})?)/i);
 const returnMatch=all.match(/(?:potential return|possible return|potential payout|payout|return|winnings)\s*[:\-]?\s*[£€$]?\s*(\d+(?:[.,]\d{1,2})?)/i);
 const stake=stakeMatch?stakeMatch[1].replace(',','.'):'';
 const ret=returnMatch?returnMatch[1].replace(',','.'):'';
 const oddsMatches=[...all.matchAll(/(?:total\s+odds|accumulator\s+odds|odds|price)\s*[:\-]?\s*(\d+(?:[.,]\d+)?)/ig)];
 let totalOdds=oddsMatches.length?oddsMatches[oddsMatches.length-1][1].replace(',',''):'';
 if(!totalOdds&&stake&&ret)totalOdds=(num(ret)/num(stake)).toFixed(2);

 const bad=/^(stake|bet amount|bet stake|amount|odds|total odds|price|return|potential return|possible return|potential payout|payout|winnings|cash out|bet builder|single|singles|accumulator|multi|placed|selection|selections|open|edit|share|add to bet slip|bet slip|total)$/i;
 const numberRx=/(\d+(?:[.,]\d{1,2})?)\s*$/;
 const marketWords=/\b(over|under|both teams|btts|match result|match winner|double chance|draw no bet|handicap|asian handicap|anytime|to score|corners?|cards?|shots?|shots on target|half time|first half|win to nil|clean sheet|team to score|total goals?|goal line|player|passes?|tackles?|fouls?)\b/i;

 const games=[];let current=null;
 for(let idx=0;idx<lines.length;idx++){
   const line=lines[idx];
   const fx=fixtureFromLine(line);
   if(fx){current={fixture:fx,markets:[]};games.push(current);continue}
   if(bad.test(line))continue;
   let work=line,odds='';
   const om=work.match(numberRx);
   if(om&&parseFloat(om[1].replace(',','.'))>=1.01&&parseFloat(om[1].replace(',','.'))<1000){odds=om[1].replace(',','.');work=work.slice(0,om.index).trim()}
   if(marketWords.test(work)){
     const market=detectMarket(work);
     let selection=cleanSelection(work,market).replace(/^[•·\-:]+\s*/,'').trim();
     if(selection||market){if(!current){current={fixture:'',markets:[]};games.push(current)}current.markets.push({selection,market})}
   }
 }
 const cleaned=games.map(g=>({fixture:g.fixture,markets:g.markets.filter(m=>m.market||m.selection)})).filter(g=>g.fixture||g.markets.length);
 const first=cleaned[0]?.markets?.[0]||{};
 return {stake,return:ret,odds:totalOdds,gamesList:cleaned,selection:first.selection||'',market:first.market||'',debugText:raw};
}
function fillFromOCR(mode,p){let form=mode==='single'?$('#singleForm'):$('#builderForm');if(!form)return;if(form.elements.stake&&p.stake)form.elements.stake.value=p.stake;if(form.elements.return&&p.return)form.elements.return.value=p.return;if(mode==='single'){if(form.elements.odds&&p.odds)form.elements.odds.value=p.odds;if(form.elements.market)form.elements.market.value=p.market||'';if(form.elements.selection)form.elements.selection.value=p.selection||'';form.dispatchEvent(new Event('input'))}else if(mode==='builder'&&p.gamesList){if(window._builderSetGames)window._builderSetGames(p.gamesList);else window._ocrGames=p.gamesList;let st=num(form.elements.stake.value),ret=num(form.elements.return.value);if(!p.odds&&st&&ret)form.elements.odds.value=(ret/st).toFixed(2);else if(p.odds)form.elements.odds.value=p.odds;}}
function monthlyBreakdown(arr){
 const map={};
 arr.filter(x=>x.result!=='Pending').forEach(x=>{
   const key=String(x.date||'').slice(0,7)||'Unknown';
   map[key]??={p:0,stake:0,n:0,w:0};
   map[key].p+=profit(x);map[key].stake+=num(x.stake);map[key].n++;if(x.result==='Won')map[key].w++;
 });
 const keys=Object.keys(map).sort().reverse();
 if(!keys.length)return '<div class="emptylist">Settle bets to see monthly performance.</div>';
 return `<div class="monthgrid">${keys.map(k=>{let m=map[k],roi=m.stake?m.p/m.stake*100:0;return `<div class="monthcard"><b>${esc(k)}</b><div class="big ${m.p>=0?'pos':'neg'}">${m.p>=0?'+':''}${money(m.p)}</div><span>${m.n} settled · ${m.w} won · ${money(m.stake)} staked · ${roi.toFixed(1)}% ROI</span></div>`}).join('')}</div>`;
}

ed':''}>Won</option><option ${b.result==='Lost'?'selected':''}>Lost</option><option ${b.result==='Void'?'selected':''}>Void</option></select></span><span class="profit ${p>=0?'pos':'neg'}">${b.result==='Pending'?'…':(p>=0?'+':'')+money(p)}</span><button class="iconbtn del" data-type="builder" data-id="${b.id}">×</button></div>`}).join('');$('#rows').innerHTML=rows.length?html:'<div class="emptylist">No bets match your filters.</div>';$$('.status').forEach(x=>x.onchange=()=>{let arr=x.dataset.result==='single'?singles:builders,b=arr.find(z=>z.id==x.dataset.id);if(b){b.result=x.value;if(x.value==='Won')b.return=num(b.stake)*num(b.odds);if(x.value==='Lost'||x.value==='Void')b.return=0;save();renderRows(type)}});$$('.del').forEach(x=>x.onclick=()=>{if(confirm('Delete this bet?')){if(x.dataset.type==='single')singles=singles.filter(b=>b.id!=x.dataset.id);else builders=builders.filter(b=>b.id!=x.dataset.id);save();renderRows(type)}});$('#search').oninput=()=>renderRows(type);$('#filter').onchange=()=>renderRows(type)}
function analytics(){
 let s=stats(singles),b=stats(builders);
 let market=group(singles,x=>x.market),
     league=group(singles,x=>x.league),
     sport=group(singles,x=>x.sport),
     bookmaker=group(singles,x=>x.bookmaker),
     oddsBand=group(singles,x=>{let o=num(x.odds);return o<1.5?'Under 1.50':o<2?'1.50–1.99':o<2.5?'2.00–2.49':o<3?'2.50–2.99':'3.00+'}),
     edge=group(singles,x=>{let e=num(x.edge);return e<5?'0–4.9%':e<10?'5–9.9%':e<15?'10–14.9%':'15%+'});
 return `<div class="analyticsgrid">
 <section class="card"><div class="head"><div><b>Builders</b><span>Independent performance</span></div></div>${statLines(b)}</section>
 <section class="card"><div class="head"><div><b>Value singles</b><span>Independent performance · average odds included</span></div></div>${statLines(s)}</section>
 ${breakdownPanel('Singles — best markets','Settled singles only · rank by profit, ROI or win rate','MARKETS_PLACEHOLDER','marketRank')}
 ${breakdownPanel('Singles — best leagues / competitions','Settled singles only · see which competitions are actually profitable','LEAGUES_PLACEHOLDER','leagueRank')}
 ${breakdownPanel('Singles — best sports','Settled singles only','SPORTS_PLACEHOLDER','sportRank')}
 ${breakdownPanel('Singles — bookmakers','Settled singles only','BOOKMAKERS_PLACEHOLDER','bookRank')}
 ${breakdownPanel('Singles — odds ranges','Settled singles only','ODDS_PLACEHOLDER','oddsRank')}
 ${breakdownPanel('Singles — value edge ranges','Settled singles only','EDGE_PLACEHOLDER','edgeRank')}
 <section class="card" style="grid-column:1/-1"><div class="head"><div><b>Singles monthly performance</b><span>Profit, stake, wins, win rate, ROI and average odds by month</span></div></div>${monthlyBreakdown(singles)}</section>

function statLines(x){return `<div class="statline"><b>Total profit</b><span>${x.n} bets</span><strong class="${x.p>=0?'pos':'neg'}">${money(x.p)}</strong></div><div class="statline"><b>Win rate</b><span>${x.settled} settled</span><strong>${x.rate.toFixed(1)}%</strong></div><div class="statline"><b>ROI</b><span>settled stake</span><strong>${x.roi.toFixed(1)}%</strong></div><div class="statline"><b>Total staked</b><span>settled</span><strong>${money(x.stake)}</strong></div><div class="statline"><b>Average odds</b><span>settled bets with odds</span><strong>${x.avgOdds?x.avgOdds.toFixed(2):'—'}</strong></div>`}
function group(arr,fn){
 const o={};
 arr.filter(x=>x.result!=='Pending').forEach(x=>{
   let k=fn(x)||'Unspecified';
   o[k]??={n:0,p:0,s:0,w:0,od:0,odn:0};
   o[k].n++;o[k].p+=profit(x);o[k].s+=num(x.stake);
   if(x.result==='Won')o[k].w++;
   if(num(x.odds)>0){o[k].od+=num(x.odds);o[k].odn++}
 });
 Object.values(o).forEach(v=>{v.roi=v.s?v.p/v.s*100:0;v.rate=v.n?v.w/v.n*100:0;v.avgOdds=v.odn?v.od/v.odn:0});
 return o;
}
function breakdown(o,rank='profit'){
 let keys=Object.keys(o);
 if(!keys.length)return '<div class="emptylist">Settle some singles to see this breakdown.</div>';
 const metric=k=>rank==='roi'?o[k].roi:rank==='win'?o[k].rate:rank==='odds'?o[k].avgOdds:o[k].p;
 keys.sort((a,b)=>metric(b)-metric(a));
 const max=Math.max(1,...keys.map(k=>Math.abs(metric(k))));
 return keys.map((k,i)=>{
   const v=o[k],cls=v.p>=0?'pos':'neg';
   return `<div class="barrow"><div class="bt"><b>${i+1}. ${esc(k)}</b><span>${v.n} settled · ${v.w} won · ${v.rate.toFixed(1)}% win · ${v.roi.toFixed(1)}% ROI · avg ${v.avgOdds?v.avgOdds.toFixed(2):'—'} · <strong class="${cls}">${v.p>=0?'+':''}${money(v.p)}</strong></span></div><div class="bar"><i style="width:${Math.max(3,Math.abs(metric(k))/max*100)}%"></i></div></div>`;
 }).join('');
}
function breakdownPanel(title,sub,data,id){
 return `<section class="card"><div class="head"><div><b>${title}</b><span>${sub}</span></div><select class="rankselect" data-rank-target="${id}"><option value="profit">Rank by profit</option><option value="roi">Rank by ROI</option><option value="win">Rank by win rate</option><option value="odds">Rank by average odds</option></select></div><div id="${id}" class="breakdown">${breakdown(data)}</div></section>`;
}

function attachScanner(id,mode){
 const input=document.getElementById(id),drop=document.getElementById(id+'drop'),
 choose=document.getElementById(id+'choose'),bar=document.getElementById(id+'bar'),
 status=document.getElementById(id+'status'),preview=document.getElementById(id+'preview');
 if(!input||!drop)return;
 const setStatus=(s,p=null)=>{status.textContent=s;if(p!==null)bar.style.width=Math.max(0,Math.min(100,p))+'%';};
 const openPicker=()=>input.click();
 choose?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openPicker()});
 drop.addEventListener('click',e=>{if(e.target!==choose)openPicker()});
 drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker()}});
 const preprocess=blob=>new Promise((resolve,reject)=>{
   const img=new Image(),url=URL.createObjectURL(blob);
   img.onload=()=>{try{
     const scale=Math.min(2.5,Math.max(1,1800/Math.max(img.width,img.height)));
     const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
     const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
     // Keep original colours; sharpening/contrast can damage small bookmaker text.
     c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('Could not prepare image'))},'image/png');
   }catch(e){URL.revokeObjectURL(url);reject(e)}};
   img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Invalid image'))};img.src=url;
 });
 input.addEventListener('change',async()=>{
   const file=input.files&&input.files[0];if(!file)return;
   if(!file.type.startsWith('image/')){setStatus('Please choose an image screenshot.');return}
   const objectUrl=URL.createObjectURL(file);
   preview.innerHTML=`<div class="previewwrap"><img class="slippreview" src="${objectUrl}" alt="Bet slip screenshot"><small>Your full screenshot is shown here so you can check what was read.</small></div>`;
   try{
     setStatus('Preparing screenshot…',5);
     const prepared=await preprocess(file);
     setStatus('Loading OCR engine…',10);
     const result=await Tesseract.recognize(prepared,'eng',{
       logger:m=>{
         if(m.status==='loading tesseract core')setStatus('Loading OCR engine…',10);
         else if(m.status==='loading language traineddata')setStatus('Loading OCR language…',20);
         else if(m.status==='recognizing text')setStatus('Reading bet slip…',20+(m.progress||0)*65);
       },
       config:{tessedit_pageseg_mode:'6'}
     });
     setStatus('Sorting teams, markets, odds and stake…',90);
     fillFromOCR(mode,parseOCR(result.data.text||''));
     setStatus('Done — check the fields before saving.',100);
   }catch(err){console.error(err);setStatus('OCR could not read this screenshot. Try a clearer/full screenshot.');bar.style.width='0%'}
   finally{URL.revokeObjectURL(objectUrl);input.value='';}
 });
}
function render(){let v=page==='Dashboard'?dashboard():page==='Add Builder'?builderForm():page==='Add Single'?singleForm():page==='Builder History'?history('builder'):page==='Single History'?history('single'):page==='Analytics'?analytics():settings();$('#view').innerHTML=v;if(page==='Add Builder'){setupBuilder();attachScanner('builderFile','builder')}if(page==='Add Single'){setupSingle();attachScanner('singleFile','single')}if(page==='Builder History')renderRows('builder');if(page==='Single History')renderRows('single');$$('.rankselect').forEach(sel=>sel.onchange=()=>{let id=sel.dataset.rankTarget;let map={marketRank:group(singles,x=>x.market),leagueRank:group(singles,x=>x.league),sportRank:group(singles,x=>x.sport),bookRank:group(singles,x=>x.bookmaker),oddsRank:group(singles,x=>{let o=num(x.odds);return o<1.5?'Under 1.50':o<2?'1.50–1.99':o<2.5?'2.00–2.49':o<3?'2.50–2.99':'3.00+'}),edgeRank:group(singles,x=>{let e=num(x.edge);return e<5?'0–4.9%':e<10?'5–9.9%':e<15?'10–14.9%':'15%+'}),singleMarket:group(singles,x=>x.market),singleLeague:group(singles,x=>x.league),singleSport:group(singles,x=>x.sport)};let el=$('#'+id);if(el)el.innerHTML=breakdown(map[id],sel.value)});if(page==='Settings'){ $('#export').onclick=exportData;$('#import').onclick=()=>$('#importFile').click();$('#installHelp').onclick=()=>installApp();$('#reset').onclick=()=>{if(confirm('Delete all tracked bets?')){builders=[];singles=[];save();nav('Dashboard')}}}$$('[data-go]').forEach(x=>x.onclick=()=>nav(x.dataset.go))}
function exportData(){let blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),builders,singles},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bet-tracker-backup.json';a.click();URL.revokeObjectURL(a.href)}
$('#importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(Array.isArray(d.builders))builders=d.builders;if(Array.isArray(d.singles))singles=d.singles;save();alert('Backup imported.');nav('Dashboard')}catch{alert('That backup file could not be read.')}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('#install').hidden=false});async function installApp(){if(deferred){await deferred.prompt();deferred=null;$('#install').hidden=true}else alert('On Android Chrome use ⋮ → Install app / Add to Home screen.');}$('#install').onclick=installApp;
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
